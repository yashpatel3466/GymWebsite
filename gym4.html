<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="gym4c.css">
</head>
<body>
    <section class="calculate section">
        <div class="calculate_container container grid">
            <div class="calculate_content">
                <div class="section_titles">
                    <h1 class="section_title-border">CALCULATE YOUR BMI</h1>
                </div>
                <p class="calculate_description">
                    The body mass index (BMI) calculator calculates body mass index from your weight and height.
                </p>
                <form action="#" class="calculate_form" id="calculate-form">
                    <div class="calculate_box">
                        <input type="number" placeholder="Height (cm)" class="calculate_input" id="calculate-cm">
                    </div>
                    <div class="calculate_box">
                        <input type="number" placeholder="Weight (kg)" class="calculate_input" id="calculate-kg">
                    </div>
                    <button type="submit" class="button button_flex">
                        Calculate Now <i class="ri-arrow-right-line"></i>
                    </button>
                </form>
                <p class="calculate_message" id="calculate-message"></p>
            </div>
            
        </div>
    </section>
    <script src="main4.js"></script>
</body>
</html>
