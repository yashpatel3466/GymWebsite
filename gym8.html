<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="gym8c.css">
</head>
<body>

<div class="container">
    
    <h1>Feedback</h1>
    <form action="tk2.html" autocomplete="off" target="_blank">
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="enter your name" required><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="enter your email id" required><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" placeholder="enter your feedback" required></textarea><br>
        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
